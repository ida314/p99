# Two lines here carry the project's name: `name` below and the `[project.scripts]
# entry. Everything else — including the whole `core` package — is name-free; the
# display name, banner and on-disk identity live in `src/core/branding.py`.

[project]
name = "p99"
version = "0.1.0"
description = "A local-first TUI that turns interview prep into timed, scored, permanently-recorded runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
p99 = "core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
